[project]
name = "erp-api"
version = "0.1.0"
description = "ERP backend (FastAPI modular monolith)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    "email-validator>=2.2",
    "python-multipart>=0.0.17",
    "structlog>=24.4",
    "tzdata>=2024.2",
    "python-dateutil>=2.9",
    "openpyxl>=3.1",
    "reportlab>=4.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.28", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
# RUF001/2: "›" is the intended category path separator.
ignore = ["B008", "RUF012", "RUF001", "RUF002"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = []
strict = false
warn_unused_ignores = true
ignore_missing_imports = true
